<style>
  :root{
    --bg1:#24171b;
    --bg2:#140d10;
    --ink:#f4e9e4;
    --muted:#c7b2ab;
    --pink:#f496b8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 90% at 50% 40%, var(--bg1), var(--bg2));
    color:var(--ink);
    font-family:"Gowun Batang",serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  /* тёплые огоньки */
  .bokeh{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .bokeh span{
    position:absolute;border-radius:50%;filter:blur(10px);opacity:0;
    animation:float linear infinite;
  }
  @keyframes float{
    0%{transform:translateY(0) scale(.9);opacity:0}
    15%,85%{opacity:var(--o)}
    100%{transform:translateY(-60px) scale(1.05);opacity:0}
  }

  main{
    position:relative;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 16px;text-align:center;
  }
  .line{
    opacity:0;transform:translateY(8px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .line.on{opacity:1;transform:translateY(0)}
  .l1{font-size:clamp(1.2rem,3vw,1.8rem);letter-spacing:.18em}
  .l2{margin-top:1rem;font-size:clamp(.85rem,1.8vw,1rem);letter-spacing:.35em;color:var(--muted)}
  .l3{margin-top:.9rem;font-size:1rem;letter-spacing:.3em;color:var(--pink)}

  /* ===== кошка, которую рисуют ===== */
  .cat{
    height:clamp(190px,40vh,360px);
    margin-top:1.6rem;
    overflow:visible;
    transition:opacity .8s ease;
  }
  .cat.hide{opacity:0}
  .cat.float{animation:floaty 3.2s ease-in-out infinite}
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-5px) rotate(-1deg)}
  }
  .cat mask path{
    fill:none;stroke:#fff;stroke-width:26;
    stroke-linecap:round;stroke-linejoin:round;
  }

  @media (prefers-reduced-motion: reduce){
    .cat.float,.bokeh span{animation:none}
  }
</style>

<script>
  const $ = id => document.getElementById(id);
  const l1=$('l1'), l2=$('l2'), l3=$('l3'), cat=$('cat');
  const strokes = [...cat.querySelectorAll('mask path')];
  const wait = ms => new Promise(r => setTimeout(r, ms));

  const DRAW_MS = 3400;   // сколько длится рисование всей кошки
  const total = strokes.reduce((s,p)=>s+ +p.dataset.len, 0);

  function resetCat(){
    strokes.forEach(p=>{
      const L = +p.dataset.len + 2;
      p.style.transition='none';
      p.style.strokeDasharray = L;
      p.style.strokeDashoffset = L;
    });
    cat.getBoundingClientRect();
  }
  function drawCat(){
    let t = 0;
    strokes.forEach(p=>{
      const dur = (+p.dataset.len / total) * DRAW_MS;
      p.style.transition = `stroke-dashoffset ${dur}ms linear ${t}ms`;
      p.style.strokeDashoffset = 0;
      t += dur;
    });
  }

  async function scene(){
    while(true){
      resetCat();
      cat.classList.remove('hide','float');
      await wait(600);
      l1.classList.add('on');
      await wait(1300);
      l2.classList.add('on');
      await wait(900);
      l3.classList.add('on');
      await wait(400);
      drawCat();
      await wait(DRAW_MS + 200);
      cat.classList.add('float');
      await wait(3800);
      cat.classList.add('hide');
      l1.classList.remove('on'); l2.classList.remove('on'); l3.classList.remove('on');
      await wait(1800);
    }
  }
  scene();

  // Тихое уведомление: сообщает, что кто-то открыл сайт.
  // Страну и время определяет посредник на своей стороне —
  // со страницы не собирается и не отправляется ничего личного.
  // Вставь сюда адрес своего Worker (получишь при деплое на Cloudflare):
  const NOTIFY_URL = 'https://ТВОЙ-WORKER.workers.dev';
  if (NOTIFY_URL.indexOf('ТВОЙ-WORKER') === -1) {
    fetch(NOTIFY_URL, { method: 'POST', keepalive: true }).catch(() => {});
  }

  // тёплые огоньки
  const bokeh = $('bokeh');
  const colors = ['255,201,138','255,214,170','244,150,184','255,236,210'];
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    const size = 6 + Math.random()*26;
    s.style.width = s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = (5 + Math.random()*85)+'%';
    s.style.background = `rgba(${colors[i%colors.length]},.9)`;
    s.style.setProperty('--o', (.12 + Math.random()*.25).toFixed(2));
    s.style.animationDuration = (10 + Math.random()*12)+'s';
    s.style.animationDelay = (-Math.random()*20)+'s';
    bokeh.appendChild(s);
  }
</script>
